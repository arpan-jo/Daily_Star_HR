// Secrets live in .env (same file react-native-dotenv reads for the JS side) so they
// are not hardcoded in Kotlin source. Keep .env out of version control.
def envFile = rootProject.file("../.env")
def envProps = new Properties()
if (envFile.exists()) {
    envFile.withInputStream { envProps.load(it) }
}
def envOrEmpty = { String key -> (envProps.getProperty(key) ?: "").trim() }

// google-services.json is generated from the tracked template with FIREBASE_API_KEY
// from .env, so the key is not committed. Regenerated on every configure.
def gsTemplate = file("google-services.json.template")
if (gsTemplate.exists()) {
    def gsFile = file("google-services.json")
    def generated = gsTemplate.text.replace('${FIREBASE_API_KEY}', envOrEmpty('FIREBASE_API_KEY'))
    if (!gsFile.exists() || gsFile.text != generated) {
        gsFile.text = generated
    }
}

